log_format app_json escape=json '{"time":"$time_iso8601","app":"$app_id","remote_addr":"$remote_addr","remote_user":"$remote_user","time_local":"$time_local","request":"$request","method":"$request_method","path":"$uri","status":$status,"request_time":$request_time,"body_bytes_sent":$body_bytes_sent,"http_referer":"$http_referer","http_user_agent":"$http_user_agent"}';
log_format app_prometheus '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';

server {
    listen 80;
    server_name _;

    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    location /app-a/ {
        set $app_id app-a;
        access_log /var/log/nginx/app-a.json app_json;
        access_log /var/log/nginx/app-a.log app_prometheus;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://app-a:8080/;
    }
    location /app-b/ {
        set $app_id app-b;
        access_log /var/log/nginx/app-b.json app_json;
        access_log /var/log/nginx/app-b.log app_prometheus;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://app-b:8080/;
    }
    location /app-c/ {
        set $app_id app-c;
        access_log /var/log/nginx/app-c.json app_json;
        access_log /var/log/nginx/app-c.log app_prometheus;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://app-c:8080/;
    }
}
