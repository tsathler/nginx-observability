global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/rules/alert-thresholds.yml
scrape_configs:
  # Every target carries `server`; Marco 04 adds one value per monitored host.
  - job_name: nginx-access
    static_configs:
      - targets: [nginxlog-exporter:4040]
        labels:
          server: lab
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
        labels:
          server: lab
  - job_name: nginx-health
    metrics_path: /nginx-metrics
    static_configs:
      - targets: [nginx:80]
        labels:
          server: lab
  - job_name: app-health
    static_configs:
      - targets: [nginx:80]
        labels:
          server: lab
          app: app-a
          scrape_path: /app-a/metrics
      - targets: [nginx:80]
        labels:
          server: lab
          app: app-b
          scrape_path: /app-b/metrics
      - targets: [nginx:80]
        labels:
          server: lab
          app: app-c
          scrape_path: /app-c/metrics
    relabel_configs:
      - source_labels: [scrape_path]
        target_label: __metrics_path__
      - action: labeldrop
        regex: scrape_path
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
        labels:
          server: lab
  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]
        labels:
          server: lab
