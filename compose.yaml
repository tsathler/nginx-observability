name: nginx-observability

services:
  app-a:
    build: ./demo/applications
    environment:
      APP_ID: app-a
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  app-b:
    build: ./demo/applications
    environment:
      APP_ID: app-b
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  app-c:
    build: ./demo/applications
    environment:
      APP_ID: app-c
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  nginx:
    image: nginx:1.29.4-alpine
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      app-a: { condition: service_healthy }
      app-b: { condition: service_healthy }
      app-c: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3

  nginxlog-exporter:
    image: quay.io/martinhelmich/prometheus-nginxlog-exporter:v1.9.2
    command: ["-config-file", "/etc/exporter/config.yml"]
    volumes:
      - ./config/exporters/nginxlog-exporter.yml:/etc/exporter/config.yml:ro
      - nginx-logs:/var/log/nginx:ro
    expose: ["4040"]
    depends_on: [nginx]

  prometheus:
    image: prom/prometheus:v3.8.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d", "--web.enable-lifecycle"]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on: [nginxlog-exporter]

  loki:
    image: grafana/loki:3.5.7
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./config/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.12.2
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - nginx-logs:/var/log/nginx:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [nginx, loki]

  grafana:
    image: grafana/grafana:12.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  traffic-generator:
    build: ./demo/traffic-generator
    environment:
      TARGET_URL: http://nginx
      REQUESTS_PER_SECOND: ${REQUESTS_PER_SECOND:-2}
    depends_on: [nginx]

volumes:
  nginx-logs:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
