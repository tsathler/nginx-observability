# Central server for Marco 04: receives logs (Loki) and metrics (Prometheus) pushed by the
# Alloy agents on the monitored Nginx servers. No Grafana here: the organization's existing
# Grafana reads these two services (see deploy/grafana/).
#
# Usage, from this directory:
#   cp .env.example .env        # then edit .env on the server; never commit it
#   docker compose up -d
#
# Loki and Prometheus are published only on 127.0.0.1. Agents reach them through the host
# Nginx (TLS + per-agent credentials + IP allowlist; see nginx-ingress.conf.example).
name: nginx-observability-central

x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  prometheus:
    <<: *hardened
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../config/prometheus/rules:/etc/prometheus/rules:ro
      - ./local-rules:/etc/prometheus/local-rules:ro
      - ${DATA_DIR:?Set DATA_DIR in .env}/prometheus:/prometheus
    networks:
      central:
        aliases: [nginx-obs-prometheus]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  loki:
    <<: *hardened
    # Same image as the lab: Loki v3.7.10 rebuilt with Go 1.26.11 and the WAL fix
    # (grafana/loki#25118). Return to an official image once one ships with Go >= 1.26.11.
    image: ghcr.io/tsathler/loki:3.7.10-go1.26.11-walfix@sha256:72931af47a600cd99a92e64103a9aed3198e93836c2c27456f627041e1ffbede
    command: ["-config.file=/etc/loki/config.yml", "-config.expand-env=true"]
    stop_grace_period: 2m
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-168h}
    ports:
      - "127.0.0.1:${LOKI_PORT:-13100}:3100"
    volumes:
      - ../../config/loki/config.yml:/etc/loki/config.yml:ro
      - ${DATA_DIR:?Set DATA_DIR in .env}/loki:/loki
    # The Loki image has no shell or HTTP client for a healthcheck; check GET /ready from the
    # host (curl http://127.0.0.1:${LOKI_PORT}/ready) and the "Loki unavailable" alert.
    networks:
      central:
        aliases: [nginx-obs-loki]

networks:
  # The existing Grafana container joins this network to read Loki and Prometheus by alias
  # (http://nginx-obs-loki:3100, http://nginx-obs-prometheus:9090).
  central:
    name: ${CENTRAL_NETWORK:-nginx-observability-central}
