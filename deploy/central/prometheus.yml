# Central Prometheus. Monitored servers push their metrics (remote_write from each Alloy
# agent, labelled server=<name>); this file only scrapes the central services themselves.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules/alert-thresholds.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]
        labels:
          server: central
  - job_name: loki
    static_configs:
      - targets: [nginx-obs-loki:3100]
        labels:
          server: central
