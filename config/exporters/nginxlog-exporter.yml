listen:
  port: 4040
  address: 0.0.0.0
  metrics_endpoint: /metrics
namespaces:
  - name: app-a
    format: '$remote_addr - - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time'
    source:
      files: [/var/log/nginx/app-a.log]
    metrics_override: { prefix: nginx }
    namespace_label: app
    histogram_buckets: [.005, .01, .025, .05, .1, .25, .5, 1, 2.5, 5]
  - name: app-b
    format: '$remote_addr - - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time'
    source:
      files: [/var/log/nginx/app-b.log]
    metrics_override: { prefix: nginx }
    namespace_label: app
    histogram_buckets: [.005, .01, .025, .05, .1, .25, .5, 1, 2.5, 5]
  - name: app-c
    format: '$remote_addr - - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time'
    source:
      files: [/var/log/nginx/app-c.log]
    metrics_override: { prefix: nginx }
    namespace_label: app
    histogram_buckets: [.005, .01, .025, .05, .1, .25, .5, 1, 2.5, 5]
