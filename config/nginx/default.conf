map $request_uri $safe_path {
    default /_unclassified;
    ~^(/app-[abc])/$ $1/;
    ~^(/app-[abc])/slow(?:\?.*)?$ $1/slow;
    ~^(/app-[abc])/slower(?:\?.*)?$ $1/slower;
    ~^(/app-[abc])/redirect(?:\?.*)?$ $1/redirect;
    ~^(/app-[abc])/forbidden(?:\?.*)?$ $1/forbidden;
    ~^(/app-[abc])/admin(?:\?.*)?$ $1/admin;
    ~^(/app-[abc])/missing(?:\?.*)?$ $1/missing;
    ~^(/app-[abc])/error(?:\?.*)?$ $1/error;
    ~^(/app-[abc])/\.env(?:\?.*)?$ $1/.env;
    ~^(/app-[abc])/\.git/config(?:\?.*)?$ $1/.git/config;
    ~^(/app-[abc])/wp-admin(?:\?.*)?$ $1/wp-admin;
    ~^(/app-[abc])/wp-login\.php(?:\?.*)?$ $1/wp-login.php;
    ~^(/app-[abc])/phpmyadmin(?:\?.*)?$ $1/phpmyadmin;
    ~^(/app-[abc])/etc/passwd(?:\?.*)?$ $1/etc/passwd;
    ~^(/app-[abc])(?:/[^?]*)?(?:\?.*)?$ $1/_unclassified;
}

log_format app_json escape=json '{"time":"$time_iso8601","app":"$app_id","remote_addr":"$remote_addr","method":"$request_method","path":"$safe_path","status":$status,"request_time":$request_time,"body_bytes_sent":$body_bytes_sent}';
log_format app_prometheus '$remote_addr - - [$time_local] "$request_method $safe_path $server_protocol" $status $body_bytes_sent "-" "-" $request_time';

server {
    listen 80;
    server_name _;

    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location = /nginx-metrics {
        access_log off;
        default_type text/plain;
        return 200 "# HELP nginx_observability_nginx_health Nginx health endpoint.\n# TYPE nginx_observability_nginx_health gauge\nnginx_observability_nginx_health 1\n";
    }
    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    location /app-a/ {
        set $app_id app-a;
        access_log /var/log/nginx/app-a.json app_json;
        access_log /var/log/nginx/app-a.log app_prometheus;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://app-a:8080/;
    }
    location = /app-a/metrics {
        access_log off;
        proxy_pass http://app-a:8080/metrics;
    }
    location /app-b/ {
        set $app_id app-b;
        access_log /var/log/nginx/app-b.json app_json;
        access_log /var/log/nginx/app-b.log app_prometheus;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://app-b:8080/;
    }
    location = /app-b/metrics {
        access_log off;
        proxy_pass http://app-b:8080/metrics;
    }
    location /app-c/ {
        set $app_id app-c;
        access_log /var/log/nginx/app-c.json app_json;
        access_log /var/log/nginx/app-c.log app_prometheus;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://app-c:8080/;
    }
    location = /app-c/metrics {
        access_log off;
        proxy_pass http://app-c:8080/metrics;
    }
}
