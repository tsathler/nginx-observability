name: nginx-observability

x-hardened: &hardened
  security_opt:
    - no-new-privileges:true

services:
  app-a:
    <<: *hardened
    cap_drop: [ALL]
    build: ./demo/applications
    environment:
      APP_ID: app-a
    expose: ["8080"]
    networks: [frontend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  app-b:
    <<: *hardened
    cap_drop: [ALL]
    build: ./demo/applications
    environment:
      APP_ID: app-b
    expose: ["8080"]
    networks: [frontend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  app-c:
    <<: *hardened
    cap_drop: [ALL]
    build: ./demo/applications
    environment:
      APP_ID: app-c
    expose: ["8080"]
    networks: [frontend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  nginx:
    <<: *hardened
    build: ./demo/nginx
    image: nginx-observability-nginx:1.30.6-alpine-libxslt-r4
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    networks: [frontend, host-access]
    depends_on:
      app-a: { condition: service_healthy }
      app-b: { condition: service_healthy }
      app-c: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3

  nginxlog-exporter:
    <<: *hardened
    cap_drop: [ALL]
    build: ./demo/nginxlog-exporter
    image: nginx-observability-nginxlog-exporter:v1.11.0-go1.27.3
    command: ["-config-file", "/etc/exporter/config.yml"]
    volumes:
      - ./config/exporters/nginxlog-exporter.yml:/etc/exporter/config.yml:ro
      - nginx-logs:/var/log/nginx:ro
    expose: ["4040"]
    networks: [metrics]
    depends_on: [nginx]

  prometheus:
    <<: *hardened
    cap_drop: [ALL]
    image: prom/prometheus:v3.16.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-7d}", "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-1GB}", "--web.enable-remote-write-receiver"]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on: [nginxlog-exporter]
    networks: [metrics, host-access]

  loki:
    <<: *hardened
    cap_drop: [ALL]
    # Rebuild of Loki v3.7.10 with Go 1.26.11 and the upstream WAL fix (grafana/loki#25118);
    # built by .github/workflows/loki-image.yml. Return to an official image once one ships with Go >= 1.26.11.
    image: ghcr.io/tsathler/loki:3.7.10-go1.26.11-walfix@sha256:72931af47a600cd99a92e64103a9aed3198e93836c2c27456f627041e1ffbede
    command: ["-config.file=/etc/loki/config.yml", "-config.expand-env=true"]
    stop_grace_period: 2m
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-168h}
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./config/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks: [logs, host-access]

  alloy:
    <<: *hardened
    image: grafana/alloy:v1.22.0
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data", "--server.http.listen-addr=0.0.0.0:12345"]
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - nginx-logs:/var/log/nginx:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [nginx, loki]
    networks: [logs, metrics]

  grafana:
    <<: *hardened
    cap_drop: [ALL]
    image: grafana/grafana:12.4.15
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run python scripts/init_lab_env.py to create local credentials}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus: {condition: service_started}
      loki: {condition: service_started}
      alert-receiver: {condition: service_healthy}
    networks: [metrics, logs, host-access, alerts]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  alert-receiver:
    <<: *hardened
    cap_drop: [ALL]
    build: ./demo/alert-receiver
    expose: ["8081"]
    networks: [alerts]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  traffic-generator:
    <<: *hardened
    cap_drop: [ALL]
    build: ./demo/traffic-generator
    environment:
      TARGET_URL: http://nginx
      REQUESTS_PER_SECOND: ${REQUESTS_PER_SECOND:-2}
    depends_on: [nginx]
    networks: [frontend]

  # --- Simulated second server (profile "lab2"): off by default; start with
  #     `docker compose --profile lab2 up -d`. Rehearses the Marco 04 push model.
  lab2-app-a:
    <<: *hardened
    cap_drop: [ALL]
    image: nginx-observability-app-a:latest
    profiles: [lab2]
    environment:
      APP_ID: app-a
    networks:
      lab2-frontend: { aliases: [app-a] }

  lab2-app-b:
    <<: *hardened
    cap_drop: [ALL]
    image: nginx-observability-app-b:latest
    profiles: [lab2]
    environment:
      APP_ID: app-b
    networks:
      lab2-frontend: { aliases: [app-b] }

  lab2-app-c:
    <<: *hardened
    cap_drop: [ALL]
    image: nginx-observability-app-c:latest
    profiles: [lab2]
    environment:
      APP_ID: app-c
    networks:
      lab2-frontend: { aliases: [app-c] }

  lab2-nginx:
    <<: *hardened
    image: nginx-observability-nginx:1.30.6-alpine-libxslt-r4
    profiles: [lab2]
    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - lab2-nginx-logs:/var/log/nginx
    networks:
      lab2-frontend: { aliases: [nginx] }
    depends_on: [lab2-app-a, lab2-app-b, lab2-app-c]

  lab2-exporter:
    <<: *hardened
    cap_drop: [ALL]
    image: nginx-observability-nginxlog-exporter:v1.11.0-go1.27.3
    profiles: [lab2]
    command: ["-config-file", "/etc/exporter/config.yml"]
    volumes:
      - ./config/exporters/nginxlog-exporter.yml:/etc/exporter/config.yml:ro
      - lab2-nginx-logs:/var/log/nginx:ro
    networks: [lab2-frontend]
    depends_on: [lab2-nginx]

  lab2-alloy:
    <<: *hardened
    image: grafana/alloy:v1.22.0
    profiles: [lab2]
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./config/lab2/config.alloy:/etc/alloy/config.alloy:ro
      - lab2-nginx-logs:/var/log/nginx:ro
    networks: [lab2-frontend, logs, metrics]
    depends_on: [lab2-nginx, lab2-exporter]

  lab2-traffic:
    <<: *hardened
    cap_drop: [ALL]
    image: nginx-observability-traffic-generator:latest
    profiles: [lab2]
    environment:
      TARGET_URL: http://nginx
      REQUESTS_PER_SECOND: "1"
    networks: [lab2-frontend]
    depends_on: [lab2-nginx]

volumes:
  nginx-logs:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
  lab2-nginx-logs:

networks:
  frontend:
    internal: true
  metrics:
    internal: true
  logs:
    internal: true
  host-access:
    driver: bridge
  alerts:
    internal: true
  lab2-frontend:
    internal: true
